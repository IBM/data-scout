server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets never change contents, so they can be cached hard.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must not be cached, or a rebuild leaves browsers asking for
    # bundle hashes that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # The UI is a single-page app: /dashboard, /submit and /job/<id> exist only
    # in the client-side router, so every unmatched path has to return
    # index.html rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
